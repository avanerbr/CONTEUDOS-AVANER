<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<title>Central de Conteúdos AVANER</title>
<meta name="description" content="Central de conteúdos do Método AVANER: Reels, anúncios, calendário, produção e bloqueios">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="metodo/metodo.css?v=2026.10.14-metodo-3">
</head>
<body>

<header class="top">
  <div class="brand">
    <h1>Método <em>AVANER</em></h1>
    <span class="sub">Central de conteúdos · Reels, anúncios e produção</span>
  </div>
  <div class="top-actions">
    <div class="gwrap">
      <input id="globalSearch" type="search" placeholder="Buscar código, tema ou frase..." autocomplete="off" aria-label="Busca global">
      <div id="globalResults" class="gresults" hidden></div>
    </div>
    <button class="btn" id="loginBtn" type="button">Entrar</button>
    <button class="btn" id="themeToggle" type="button" aria-label="Alternar tema">Tema</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Seções">
  <button role="tab" aria-selected="true" data-view="calendario">Calendário</button>
  <button role="tab" aria-selected="false" data-view="hoje">Hoje</button>
  <button role="tab" aria-selected="false" data-view="reels">Reels</button>
  <button role="tab" aria-selected="false" data-view="anuncios">Anúncios</button>
  <button role="tab" aria-selected="false" data-view="lotes">Lotes</button>
  <button role="tab" aria-selected="false" data-view="pendencias">Pendências <span class="badge" id="pendBadge"></span></button>
  <button role="tab" aria-selected="false" data-view="resultados">Resultados</button>
  <button role="tab" aria-selected="false" data-view="formatos">Formatos</button>
</nav>

<main>
  <div id="conn" class="conn local">Carregando…</div>

  <section class="view active" id="view-calendario"></section>
  <section class="view" id="view-hoje"></section>
  <section class="view" id="view-reels"></section>
  <section class="view" id="view-anuncios"></section>
  <section class="view" id="view-lotes"></section>
  <section class="view" id="view-pendencias"></section>
  <section class="view" id="view-resultados"></section>
  <section class="view" id="view-formatos"></section>
</main>

<footer>
  <span id="footerBuild">Central de Conteúdos AVANER</span>
  <a href="campanhas-yamaha.html">Campanhas Yamaha (histórico)</a>
</footer>

<div id="detail" hidden><div id="detailPanel" role="dialog" aria-modal="true" aria-label="Detalhe da peça"></div></div>

<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h3 style="margin-top:0">Entrar na central</h3>
    <p class="small muted">Use o e-mail e a senha criados no Supabase para a equipe. Sem entrar, o status fica salvo só neste navegador.</p>
    <label for="loginEmail">E-mail</label>
    <input id="loginEmail" type="email" autocomplete="username" required>
    <label for="loginPass">Senha</label>
    <input id="loginPass" type="password" autocomplete="current-password" required>
    <p class="msg" id="loginMsg"></p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" type="button" id="loginCancel">Cancelar</button>
      <button class="btn primary" type="submit">Entrar</button>
    </div>
  </form>
</div>

<div id="tp" hidden>
  <div id="tpGuide"></div>
  <div id="tpScroll"><div id="tpText"></div></div>
  <div id="tpBar">
    <button id="tpPlay" class="go" type="button">▶ Rolar</button>
    <button id="tpSlow" type="button" aria-label="Mais devagar">−</button><span id="tpSpd">vel 3</span><button id="tpFast" type="button" aria-label="Mais rápido">+</button>
    <button id="tpSmall" type="button" aria-label="Diminuir letra">A−</button><button id="tpBig" type="button" aria-label="Aumentar letra">A+</button>
    <button id="tpMode" type="button">Ver guia</button>
    <button id="tpMirror" type="button">Espelhar</button>
    <button id="tpTop" type="button">Início</button>
    <button id="tpClose" type="button">Fechar</button>
  </div>
</div>

<script>
window.addEventListener('error', function(e){
  try { var el=document.getElementById('conn'); if(el){ el.className='conn err'; el.textContent='Erro de carregamento: '+String(e.message||'erro no JavaScript'); } } catch(_){}
});
</script>
<script src="supabase-config.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/dados-base.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/dados-reels-1.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/dados-reels-2.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/dados-reels-3.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/dados-anuncios.js?v=2026.10.14-metodo-3"></script>
<script src="metodo/app.js?v=2026.10.14-metodo-3"></script>
<script>
(function(){
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js';
  s.async=true;
  s.onload=function(){ if(window.MetodoSync) window.MetodoSync.init(); };
  s.onerror=function(){ if(window.MetodoSync) window.MetodoSync.cdnFail(); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
